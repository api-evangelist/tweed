openapi: 3.2.0
info:
  title: Tweed Checkout API
  description: ''
  version: '1.0'
  contact: {}
servers: []
tags:
- name: Checkout
paths:
  /checkout/transaction-price:
    post:
      operationId: getCheckoutItemPrice
      summary: Get the price of an item
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPriceRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPriceResponseDto'
      tags:
      - Checkout
  /checkout/create-intent:
    post:
      operationId: CheckoutController_createCheckoutIntent
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutIntentRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutIntentResponseDto'
      tags:
      - Checkout
      summary: Checkout controller create checkout intent
      x-summary-source: derived
  /checkout/perform-checkout:
    post:
      operationId: CheckoutController_performCheckout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformCheckoutRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformCheckoutResponseDto'
      tags:
      - Checkout
      summary: Checkout controller perform checkout
      x-summary-source: derived
  /checkout/{id}:
    get:
      operationId: getCheckoutById
      summary: Get checkout by ID
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - Checkout
components:
  schemas:
    CheckoutIntentRequestDto:
      type: object
      properties:
        itemId:
          type: string
        quantity:
          type: number
        userWalletAddress:
          type: string
        receiptEmail:
          type: string
        customParams:
          type: object
      required:
      - itemId
      - quantity
      - userWalletAddress
      - receiptEmail
    PerformCheckoutRequestDto:
      type: object
      properties:
        checkoutId:
          type: string
        customParams:
          type: object
      required:
      - checkoutId
    ItemPriceResponseDto:
      type: object
      properties:
        totalTransactionPriceUSD:
          type: number
        singleItemPriceUSD:
          type: number
        includedFees:
          type: number
        gasFee:
          type: number
      required:
      - totalTransactionPriceUSD
      - singleItemPriceUSD
      - includedFees
      - gasFee
    PerformCheckoutResponseDto:
      type: object
      properties:
        checkoutId:
          type: string
        kyc:
          $ref: '#/components/schemas/KycDto'
      required:
      - checkoutId
    CheckoutIntentResponseDto:
      type: object
      properties:
        checkoutId:
          type: string
        status:
          type: string
        clientSecret:
          type: string
        price:
          $ref: '#/components/schemas/ItemPriceResponseDto'
      required:
      - checkoutId
      - status
      - clientSecret
      - price
    ItemPriceRequestDto:
      type: object
      properties:
        itemId:
          type: string
        customParams:
          type: object
      required:
      - itemId
    KycDto:
      type: object
      properties:
        kycStatus:
          type: string
          enum:
          - NOT_REQUIRED
          - REQUIRED
          - PENDING
          - APPROVED
          - BLOCKED
        kycFactor:
          type: string
          enum:
          - PAYMENT_METHOD_FINGERPRINT_CUMULATIVE
          - WALLET_ADDRESS_CUMULATIVE
          - TOTAL_TRANSACTION_AMOUNT
        kycLink:
          type: string
      required:
      - kycStatus
  securitySchemes:
    bearer:
      scheme: Bearer
      bearerFormat: Bearer
      description: 'Please enter token in following format: Bearer JWT'
      type: http
x-amazon-apigateway-gateway-responses:
  DEFAULT_4XX:
    statusCode: 403
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
      gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
      gatewayresponse.header.Access-Control-Allow-Methods: '''GET,OPTIONS,POST'''
    responseTemplates:
      application/json: '{"message":$context.error.messageString}'
  DEFAULT_5XX:
    statusCode: 500
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
      gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
      gatewayresponse.header.Access-Control-Allow-Methods: '''GET,OPTIONS,POST'''
    responseTemplates:
      application/json: '{"message":$context.error.messageString}'
