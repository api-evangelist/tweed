      summary: ''
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformWebhookDto'
      tags:
      - platform-webhooks
      security:
      - bearer: []
    post:
      operationId: addPlatformWebhook
      summary: ''
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlatformWebhookDto'
      responses:
        '201':
          description: ''
      tags:
      - platform-webhooks
      security:
      - bearer: []
  /v1/platform-webhooks/{id}:
    put:
      operationId: updatePlatformWebhook
      summary: ''
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
