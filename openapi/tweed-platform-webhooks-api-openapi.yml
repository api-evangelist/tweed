components:
  schemas:
    SetPlatformWebhookActiveDto:
      type: object
      properties:
        isActive:
          type: boolean
      required:
      - isActive
    PlatformWebhookDto:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        isActive:
          type: boolean
        events:
          type: array
          items:
            type: string
        createdAt:
          format: date-time
          type: string
        lastUpdatedAt:
          format: date-time
          type: string
      required:
      - id
      - url
      - isActive
      - events
    CreatePlatformWebhookDto:
      type: object
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
        secret:
          type: string
      required:
      - url
      - events
    UpdatePlatformWebhookDto:
      type: object
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
        secret:
          type: string
  securitySchemes:
    bearer:
      scheme: Bearer
      bearerFormat: Bearer
      description: 'Please enter token in following format: Bearer JWT'
      type: http
