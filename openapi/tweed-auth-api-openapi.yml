openapi: 3.2.0
info:
  title: Tweed Auth API
  description: ''
  version: '1.0'
  contact: {}
servers: []
tags:
- name: Auth
paths:
  /v1/auth:
    post:
      operationId: AuthController_verify
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
      tags:
      - Auth
      security:
      - bearer: []
      summary: Auth controller verify
      x-summary-source: derived
  /v1/auth/api-keys:
    post:
      operationId: AuthController_generateApiToken
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenDto'
      tags:
      - Auth
      security:
      - bearer: []
      summary: Auth controller generate api token
      x-summary-source: derived
    get:
      operationId: AuthController_getApiKeys
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiTokenDto'
      tags:
      - Auth
      security:
      - bearer: []
      summary: Auth controller get api keys
      x-summary-source: derived
  /v1/auth/api-keys/{token}:
    delete:
      operationId: AuthController_deleteApiKey
      parameters:
      - name: token
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - Auth
      security:
      - bearer: []
      summary: Auth controller delete api key
      x-summary-source: derived
components:
  schemas:
    ApiTokenDto:
      type: object
      properties:
        token:
          type: string
        secret:
          type: string
        createdAt:
          format: date-time
          type: string
      required:
      - token
      - secret
  securitySchemes:
    bearer:
      scheme: Bearer
      bearerFormat: Bearer
      description: 'Please enter token in following format: Bearer JWT'
      type: http
x-amazon-apigateway-gateway-responses:
  DEFAULT_4XX:
    statusCode: 403
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
      gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
      gatewayresponse.header.Access-Control-Allow-Methods: '''GET,OPTIONS,POST'''
    responseTemplates:
      application/json: '{"message":$context.error.messageString}'
  DEFAULT_5XX:
    statusCode: 500
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
      gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
      gatewayresponse.header.Access-Control-Allow-Methods: '''GET,OPTIONS,POST'''
    responseTemplates:
      application/json: '{"message":$context.error.messageString}'
