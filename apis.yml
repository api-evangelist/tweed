aid: tweed
name: Tweed
description: >-
  Tweed is an Accel-backed embedded-crypto platform offering Wallet-as-a-Service
  and NFT/token checkout APIs. Platforms embed self-custodial wallets (social
  login recovery, EIP-1193 EVM provider) and sell fungible and non-fungible
  tokens to buyers paying by card, Apple Pay, or Google Pay, with fiat, native,
  or stablecoin settlement across 12+ chains including Ethereum, Polygon, Base,
  Solana, and Tezos. A REST API (V2) manages contracts, items, payouts,
  checkouts, and HMAC-signed webhooks; note the marketing site and dashboard
  host were unreachable as of July 2026 while the docs, API, and npm SDKs
  remain live.
